name: Android CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check UI text, lint and build
        run: ./gradlew checkUiText lint assembleDebug :core:model:build :core:protocol:build :core:account:build

  # A tag such as v0.0.1 publishes a GitHub release once the build above has passed. The APK is signed with the release
  # key kept in the repository secrets XM_KEYSTORE_BASE64, XM_STORE_PASSWORD, XM_KEY_ALIAS and XM_KEY_PASSWORD.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      XM_STORE_PASSWORD: ${{ secrets.XM_STORE_PASSWORD }}
      XM_KEY_ALIAS: ${{ secrets.XM_KEY_ALIAS }}
      XM_KEY_PASSWORD: ${{ secrets.XM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # A hotfix keeps the displayed version and gets a new tag without moving the original.
          if [[ "$GITHUB_REF_NAME" != "v$version" && ! "$GITHUB_REF_NAME" =~ ^"v${version}-hotfix-"[1-9][0-9]*$ ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.XM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$XM_STORE_PASSWORD" && test -n "$XM_KEY_ALIAS" && test -n "$XM_KEY_PASSWORD" \
            || { echo "The release signing secrets are not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "XM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APK
        run: ./gradlew assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "XMPlus-MD3-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "XMPlus-MD3-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "XMPlus MD3 ${GITHUB_REF_NAME#v}" --generate-notes

name: Android CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check UI text, lint and build
        run: ./gradlew checkUiText lint assembleDebug :core:model:build :core:protocol:build :core:account:build

  # A tag such as v0.0.1 publishes a GitHub release once the build above has passed. The APK is debug-signed until a
  # release keystore exists, which the release notes say.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match versionName $version"; exit 1; }
      - name: Build the APK
        run: ./gradlew assembleDebug
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "XMPlus-MD3-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "XMPlus-MD3-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "XMPlus MD3 ${GITHUB_REF_NAME#v}" --prerelease --generate-notes \
            --notes "First preview. Signed with the debug key, so install it as a test build."
